name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: casper-vpn-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Download VPN core (sing-box) and wintun
        shell: pwsh
        run: |
          $v = "1.14.2"
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$v/sing-box-$v-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb
          Copy-Item "sb/sing-box-$v-windows-amd64/*" bin -Recurse
          try {
            Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wt.zip
            Expand-Archive wt.zip -DestinationPath wt
            Copy-Item "wt/wintun/bin/amd64/wintun.dll" bin
          } catch { Write-Warning "wintun not downloaded: $_" }
          Get-ChildItem bin
          if (-not (Test-Path bin/sing-box.exe)) { throw "sing-box.exe missing" }
      - run: npm install
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: casper-vpn-windows
          path: dist/*.exe
