<text class="zz" x="76" y="20" font-size="15" font-weight="700" style="fill:var(--ac)">z</text></svg>`;
$("core").innerHTML=G;$("lg").innerHTML=G.replace('class="gh"','class="gh"').replace(/<g class="st2">.*?<\/g>/s,"");

/* флаги */
const F={NL:["#AE1C28","#fff","#21468B"],DE:["#111","#DD0000","#FFCE00"],AT:["#ED2939","#fff","#ED2939"]};
function flag(cc){let b;const r='<rect width="30" height="20"';
 if(F[cc])b=F[cc].map((c,i)=>`<rect y="${i*6.67}" width="30" height="6.67" fill="${c}"/>`).join("");
 else if(cc=="PL")b=r+' height="10" fill="#fff"/><rect y="10" width="30" height="10" fill="#DC143C"/>';
 else if(cc=="FI")b=r+' fill="#fff"/><rect x="8" width="5" height="20" fill="#003580"/><rect y="7.5" width="30" height="5" fill="#003580"/>';
 else if(cc=="SE")b=r+' fill="#006AA7"/><rect x="9" width="4.5" height="20" fill="#FECC00"/><rect y="7.75" width="30" height="4.5" fill="#FECC00"/>';
 else b=r+' fill="#8f87ab"/>';
 return `<svg viewBox="0 0 30 20" style="width:36px;height:24px;border-radius:5px;stroke:none;box-shadow:0 0 0 1px rgba(128,120,160,.35)">${b}</svg>`}

/* серверы (в настоящем приложении — из панели по подписке) */
const PANEL=[["NL","Нидерланды","Netherlands"],["DE","Германия","Germany"],["FI","Финляндия","Finland"],["AT","Австрия","Austria"],["SE","Швеция","Sweden"]];
let seen=new Set();try{seen=new Set(JSON.parse(localStorage.getItem("seen")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("seen",JSON.stringify([...seen]))}catch(e){}};
const rnd=()=>Math.round(25+Math.random()*180);
function pull(list){const first=seen.size==0;
 servers=list.map(p=>{const id=p[3]||p[0];return{id,cc:p[0],n:[p[1],p[2]],link:p[3],host:p[4],port:p[5],ping:(servers.find(s=>s.id==id)||{}).ping||(REAL?0:rnd())}});
 if(first){servers.forEach(s=>seen.add(s.id));save()}
 $("upd").textContent=t("updated")+" "+new Date().toLocaleTimeString().slice(0,5);draw()}
function measure(){if(REAL)return Promise.all(servers.map(async s=>{s.ping=await casper.ping(s.host,s.port)})).then(draw);servers.forEach(s=>s.ping=Math.max(8,s.ping+Math.round((Math.random()-.5)*30)));draw()}
const best=()=>servers.reduce((a,b)=>(b.ping>0&&(a.ping<=0||b.ping<a.ping))?b:a,servers[0]);
const pc=p=>p<=0?"var(--mut)":p<70?"var(--ok)":p<130?"var(--wa)":"var(--bd)";
const nm=s=>s.n[lang=="ru"?0:1];
function draw(){if(!servers.length)return;const b=best(),o=[...servers.filter(s=>!seen.has(s.id)),...servers.filter(s=>seen.has(s.id))];
 $("srv").innerHTML=o.map(s=>`<div class="srv ${servers[cur].id==s.id?'sel':''} ${s===b&&b.ping>0?'best':''}" data-id="${s.id}">${flag(s.cc)}<div>${seen.has(s.id)?"":`<span class="new">${t("newsrv")}</span>`}<b data-b="${t("best")}">${nm(s)}</b></div><span class="ping" style="color:${pc(s.ping)}">${s.ping>0?s.ping+" "+t("ms"):"—"}</span></div>`).join("");
 $("srv").querySelectorAll(".srv").forEach(r=>r.onclick=()=>{cur=servers.findIndex(s=>s.id==r.dataset.id);seen.add(r.dataset.id);save();draw();status()})}
function status(){const p=$("p1");p.classList.toggle("on",on);p.classList.toggle("off",!on);
 $("stt").textContent=on?t("on"):t("off");
 if(!busy)$("sub").textContent=on?`${nm(servers[cur])} · ${servers[cur].ping} ${t("ms")} · ${t("tap_off")}`:t("tap_on");
 $("m0").className=mode==0?"on":"";$("m1").className=mode==1?"on":"";$("mnote").textContent=t(mode==1?"note_fast":"note_auto")}
const splitCfg=()=>({enabled:split,apps:[...vpn].map(n=>n+".exe")});
$("orb").onclick=async()=>{if(busy)return;busy=true;$("p1").classList.add("busy");if(!on)$("sub").textContent=t("searching");
 let err="";const t0=Date.now();
 try{if(!on){await measure();if(mode==1)cur=servers.indexOf(best());
   if(REAL){const r=await casper.connect(servers[cur].link,splitCfg());if(!r.ok)err=r.error||"?"}}
  else if(REAL)await casper.disconnect()}catch(e){err=String(e)}
 await wait(Math.max(0,1000-(Date.now()-t0)));
 if(!err)on=!on;$("p1").classList.remove("busy");busy=false;draw();status();if(err)$("sub").textContent=t("err_conn")+": "+err};
$("m0").onclick=()=>{mode=0;status()};$("m1").onclick=()=>{mode=1;status()};
setInterval(()=>{if(user){measure();if(on)status()}},REAL?15000:4000);

/* раздельное туннелирование (в настоящем приложении список берётся с телефона) */
let apps=[["Telegram","#6aa5f0"],["YouTube","#e0709a"],["TikTok","#8a6be8"],["WhatsApp","#4fb99a"],["Chrome","#e0a15a"],["Сбербанк","#4fb99a"],["Госуслуги","#6aa5f0"],["Яндекс Браузер","#e0709a"],["Discord","#9b7fe0"],["Spotify","#4fb99a"]];
let sv=null;try{sv=JSON.parse(localStorage.getItem("vpn"))}catch(e){}
const vpn=new Set(sv||(REAL?[]:["Telegram","YouTube","TikTok","Discord","Chrome"]));
const pal=["#6aa5f0","#e0709a","#8a6be8","#4fb99a","#e0a15a","#9b7fe0"];
async function loadApps(){if(!REAL)return;const l=await casper.apps();apps=[...new Set([...vpn,...l])].sort().map((n,i)=>[n,pal[i%6]]);da()}
function da(){const f=$("q").value.toLowerCase();$("apps").innerHTML=apps.filter(a=>a[0].toLowerCase().includes(f)).map(a=>`<div class="app1 ${vpn.has(a[0])?'sel':''}" data-n="${a[0]}"><span class="cc" style="background:${a[1]}">${a[0][0]}</span><b>${a[0]}</b><em>${t(vpn.has(a[0])?"via":"direct")}</em><span class="sw ${vpn.has(a[0])?'on':''}" style="margin:0"></span></div>`).join("");
 $("apps").querySelectorAll(".app1").forEach(r=>r.onclick=()=>{const n=r.dataset.n;vpn.has(n)?vpn.delete(n):vpn.add(n);try{localStorage.setItem("vpn",JSON.stringify([...vpn]))}catch(e){}da()})}
$("q").oninput=da;
$("sw").onclick=()=>{split=!split;$("sw").className="sw"+(split?" on":"");$("body").classList.toggle("hide",!split)};

/* язык */
function langBtns(){["lang0","lang1"].forEach(id=>{$(id).innerHTML=["ru","en"].map(l=>`<button class="${l==lang?'on':''}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
 $(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}applyLang()})})}
function applyLang(){document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
 langBtns();da();if(servers.length){draw();status();$("upd").textContent=t("updated")+" "+new Date().toLocaleTimeString().slice(0,5)}if(user)renderAcc()}

/* аккаунт */
const PLANS=[["Призрачный старт",1],["Тихий призрак",3],["Король призраков",12]]; // ← названия замените на те, что в вашем боте
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const fmt=d=>d.toLocaleString(lang=="ru"?"ru-RU":"en-GB",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
function mkUser(m,v){const h=hash(m+v),pl=PLANS[h%3],end=new Date(Date.now()+(20+h%60)*864e5);
 end.setHours(h%24,(h>>3)%60);const buy=new Date(end-pl[1]*30*864e5);
 return{name:m=="tg"?"Алексей":"User_"+v.slice(-4).toUpperCase(),id:m=="tg"?"7012345678":String(100000000+h%900000000),plan:pl[0],buy,end,used:10+h%150,total:200}}
function renderAcc(){$("av").textContent=user.name[0];$("un").textContent=user.name;$("uid").textContent=user.id?"ID: "+user.id:"";
 $("kp").parentElement.classList.toggle("hide",!!user.slim);$("kb").parentElement.classList.toggle("hide",!!user.slim);
 $("kp").textContent=user.plan;$("kb").textContent=user.buy?fmt(user.buy):"";$("ke").textContent=user.end?fmt(user.end):"—";
 $("tb").style.width=user.total?Math.min(100,Math.round(user.used/user.total*100))+"%":"0%";
 $("tt").textContent=user.total?`${user.used} ${t("of")} ${user.total} ${t("gb")}`:`${user.used} ${t("gb")}`;
 $("manage").href=`https://t.me/${BOT}?start=account`;$("support").href=`https://t.me/${BOT}?start=support`}
function enter(m,v,real){user=real||mkUser(m,v);renderAcc();$("login").classList.add("hide");$("appw").classList.remove("hide");pull(real?real.list:PANEL);status();loadApps();if(REAL)measure()}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const mk=r=>r.servers.map(x=>[x.cc,x.name,x.name,x.link,x.host,x.port]);
async function finishToken(token){const me=await casper.api("GET","/me",null,token);if(!me.ok||!me.data.ok)return null;const d=me.data;
 if(!d.sub_link){$("err").textContent=t("err_link");return null}
 const r=await casper.fetchSub(d.sub_link);if(!r.ok||!r.servers.length){$("err").textContent=t("err_net");return null}
 return{token,name:d.name,id:String(d.id),plan:d.plan,buy:d.purchased_at?new Date(d.purchased_at):null,end:d.expires_at?new Date(d.expires_at):null,used:+(r.info.used/1e9).toFixed(1),total:Math.round(r.info.total/1e9),list:mk(r)}}
async function tokenLogin(m,v,tx){let token=null;
 if(m=="code"){const r=await casper.api("POST","/login/code",{code:v});if(r.ok&&r.data.ok)token=r.data.token;else{$("err").textContent=t(r.status==0?"err_api":"err_code");return null}}
 else{const s=await casper.api("POST","/login/tg/start");if(!s.ok){$("err").textContent=t("err_api");return null}
  window.open(`https://t.me/${BOT}?start=login_${s.data.nonce}`,"_blank");tx.textContent=t("waiting");
  for(let i=0;i<150&&!token;i++){await wait(2000);const p=await casper.api("GET","/login/tg/poll?nonce="+s.data.nonce);if(p.ok&&p.data.ok)token=p.data.token;else if(p.status==404)break}
  if(!token){$("err").textContent=t("err_expired");return null}}
 const u=await finishToken(token);if(!u&&!$("err").textContent)$("err").textContent=t("err_api");return u}
async function login(m,v,silent){const b=document.querySelector(m=="tg"?"#tgb":`[data-go="${m=="code"?1:2}"]`),tx=b.firstElementChild||b,old=tx.textContent;
 $("err").textContent="";b.disabled=true;tx.textContent=t(m=="tg"?"opening":"checking");
 let ok=false,real=null;
 if(REAL){
  if(m=="code"||m=="tg"){real=await tokenLogin(m,v,tx);ok=!!real}
  else{const r=await casper.fetchSub(v.trim());
   if(r.ok&&r.servers.length){ok=true;real={name:r.title||"Casper VPN",id:"",slim:true,end:r.info.expire?new Date(r.info.expire):null,used:+(r.info.used/1e9).toFixed(1),total:Math.round(r.info.total/1e9),list:r.servers.map(x=>[x.cc,x.name,x.name,x.link,x.host,x.port])}}
   else if(!silent)$("err").textContent=r.ok?t("err_link"):t("err_net")+" ("+r.error+")"}
 }else{
  await wait(m=="tg"?1300:700);
  ok=m=="tg"||(m=="code"?v.replace(/\W/g,"").length==12:(()=>{try{const x=new URL(v.trim());return x.protocol=="https:"&&x.pathname.length>6}catch(e){return false}})());
  if(!ok&&!silent)$("err").textContent=t(m=="code"?"err_code":"err_link")}
 b.disabled=false;tx.textContent=old;if(!ok)return;
 try{localStorage.setItem("auth",JSON.stringify(real&&real.token?["tok",real.token]:[m,v]))}catch(e){}enter(m,v,real)}
$("tgb").onclick=()=>login("tg","");
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>login(b.dataset.go==1?"code":"link",b.dataset.go==1?$("code").value:$("lnk").value));
$("code").oninput=e=>{const v=e.target.value.replace(/[^a-z0-9]/gi,"").toUpperCase().slice(0,12);e.target.value=v.match(/.{1,4}/g)?.join("-")||""};
$("paste").onclick=async()=>{try{$("lnk").value=await navigator.clipboard.readText()}catch(e){$("err").textContent=t("err_paste")}};
function ltab(n){lm=n;$("err").textContent="";[0,1,2].forEach(i=>{$("pn"+i).classList.toggle("hide",i!=n);document.querySelector(`#ltabs [data-m="${i}"]`).className=i==n?"on":""})}
document.querySelectorAll("#ltabs button").forEach(b=>b.onclick=()=>ltab(+b.dataset.m));
$("logout").onclick=()=>{if(REAL)casper.disconnect();try{localStorage.removeItem("auth")}catch(e){}on=false;user=null;tab(1);status();$("appw").classList.add("hide");$("login").classList.remove("hide")};
function tab(n){$("p1").classList.toggle("hide",n!=1);$("p2").classList.toggle("hide",n!=2);$("n1").className="nb"+(n==1?" on":"");$("n2").className="nb"+(n==2?" on":"")}
$("n1").onclick=()=>tab(1);$("n2").onclick=()=>{tab(2);loadApps()};

ltab(0);applyLang();
let a=null;try{a=JSON.parse(localStorage.getItem("auth"))}catch(e){}
if(a){if(a[0]=="tok"&&REAL)finishToken(a[1]).then(u=>{if(u)enter("tok",a[1],u)});else login(a[0],a[1],true)}
</script></body></html>
